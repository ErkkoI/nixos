name: cron update flake.lock
# cheers to https://blog.gothuey.dev/2025/nixos-auto-upgrade/
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@31.11.3
      - run: nix flake update
      - name: Update t3code-nightly
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/pingdotgg/t3code/releases?per_page=100" \
            | jq -er '[.[] | select((.draft | not) and .prerelease and (.tag_name | test("^v.*-nightly\\.")) and any(.assets[]; .name == "T3-Code-Nightly-x86_64.AppImage" and (.digest // "" | startswith("sha256:"))))][0]')
          version=$(echo "$release" | jq -er '.tag_name | ltrimstr("v")')
          digest=$(echo "$release" | jq -er '.assets[] | select(.name == "T3-Code-Nightly-x86_64.AppImage") | .digest | ltrimstr("sha256:")')
          hash=$(nix hash convert --hash-algo sha256 --to sri "$digest")
          sed -i "s|version = \".*\";|version = \"$version\";|" t3code-nightly.nix
          sed -i "s|hash = \".*\";|hash = \"$hash\";|" t3code-nightly.nix
      - name: Verify NixOS configurations evaluate
        run: |
          nix eval .#nixosConfigurations.pannu.config.system.build.toplevel.drvPath
          nix eval .#nixosConfigurations.torni.config.system.build.toplevel.drvPath
      - uses: stefanzweifel/git-auto-commit-action@v7.2.1
        with:
          commit_message: 'chore(deps): bump flake.lock and t3code-nightly'
          commit_user_name: Flake Bot Update
          commit_author: Flake Bot Update <actions@github.com>
          branch: main
          file_pattern: flake.lock t3code-nightly.nix
          skip_dirty_check: false
          skip_fetch: true
